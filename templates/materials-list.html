{% extends "base_tmp.html" %}

{% block content %}
<!-- Автономний контейнер, який на 100% захищає сайдбар від зсувів -->
<div style="width: 100%; height: calc(100vh - 80px); border: none; overflow: hidden;">
    <iframe id="materialsFrame" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<script>
// Генеруємо автономну сторінку всередині iframe
const iframe = document.getElementById('materialsFrame');
const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

const htmlContent = `
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"><\/script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"><\/script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"><\/script>
    <style>
        body { padding: 10px; background-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        .dataTables_wrapper { width: 100%; }
        table.dataTable { width: 100% !important; }
        td { word-break: break-word; }
    </style>
</head>
<body>
    <div class="card mb-2 shadow-sm border-0 bg-light">
        <div class="card-body p-2">
            <div class="row g-2 align-items-center">
                <div class="col-md-6">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white">🔍</span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Пошук (мін. 2 символи, %)..." autofocus autocomplete="off">
                        <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()">✕</button>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="spinner-border spinner-border-sm text-primary" id="loader" style="display:none;"></div>
                    <span class="small text-muted ms-1" id="statusText">Очікування вводу...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm p-3">
        <table id="materialsTable" class="table table-striped table-hover table-sm w-100">
            <thead class="table-dark">
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th style="width: 130px;">NSN Orig</th>
                    <th style="width: 110px;">Material</th>
                    <th style="width: 130px;">NSN</th>
                    <th>Найменування (NAME_SHORT)</th>
                    <th style="width: 80px;" class="text-center">Од. вим.</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
    $(document).ready(function() {
        let searchTimeout = null;

        const table = $('#materialsTable').DataTable({
            language: { url: '//cdn.datatables.net/plug-ins/1.13.7/i18n/uk.json' },
            searching: false,
            paging: true,
            pageLength: 25,
            autoWidth: false,
            columns: [
                { data: 'ID', render: d => \`<code>\${d || ''}</code>\` },
                { data: 'NSN_ORIG', defaultContent: '' },
                { data: 'MATERIAL', render: d => \`<code>\${d || ''}</code>\` },
                { data: 'NSN', defaultContent: '' },
                {
                    data: 'NAME_SHORT',
                    render: function(data, type, row) {
                        let html = \`<div class="fw-bold text-dark">\${data || '—'}</div>\`;
                        if (row.NAME_LONG) {
                            html += \`<div class="small text-muted mt-1">📄 \${row.NAME_LONG}</div>\`;
                        }
                        return html;
                    }
                },
                { data: 'UNITS', defaultContent: '', className: 'text-center' }
            ]
        });

        function performSearch(query) {
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('statusText');
            const cleanQuery = query.replace(/[%_\\s]/g, '');

            if (cleanQuery.length < 2) {
                table.clear().draw();
                statusText.innerText = 'Очікування вводу...';
                loader.style.display = 'none';
                return;
            }

            statusText.innerText = 'Пошук...';
            loader.style.display = 'inline-block';

            fetch(\`/api/materials?q=\${encodeURIComponent(query)}\`)
                .then(res => res.json())
                .then(data => {
                    loader.style.display = 'none';
                    if (!Array.isArray(data)) return;

                    statusText.innerText = \`Знайдено записів: \${data.length}\`;

                    const normalizedData = data.map(item => {
                        let newItem = {};
                        for (let key in item) newItem[key.toUpperCase()] = item[key];
                        return newItem;
                    });

                    table.clear();
                    table.rows.add(normalizedData);
                    table.draw();
                })
                .catch(() => {
                    loader.style.display = 'none';
                    statusText.innerText = 'Помилка запиту';
                });
        }

        $('#searchInput').on('input', function() {
            const query = this.value.trim();
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => performSearch(query), 300);
        });

        const urlParams = new URLSearchParams(window.parent.location.search);
        const urlQuery = urlParams.get('q');
        if (urlQuery) {
            $('#searchInput').val(urlQuery);
            performSearch(urlQuery);
        }
    });

    function clearSearch() {
        $('#searchInput').val('');
        $('#searchInput').trigger('input').focus();
    }
    <\/script>
</body>
</html>
`;

iframeDoc.open();
iframeDoc.write(htmlContent);
iframeDoc.close();
</script>
{% endblock %}
